project: 
    type: website
    render:
        - "*.qmd"
        - "!README.md"
        - "!cv-pdf.qmd"

website: 
    title: "Timothy Keyes"
    site-url: "https://keyes-timothy.github.io"
    description: "Personal website of Timothy Keyes — Data Scientist at Stanford Health Care and MD/PhD Candidate at Stanford Medicine."
    open-graph: true
    twitter-card: true
    navbar: 
        left: 
            - text: "Bio"
              href: bio.qmd
            - text: "CV"
              href: cv.qmd
            - text: "Publications"
              href: publications.qmd
            - text: "Research"
              href: research.qmd
            - text: "Talks"
              href: talks.qmd
            - text: "Blog"
              href: blog.qmd
        right:
            - icon: github
              href: https://github.com/keyes-timothy
              aria-label: GitHub
            - icon: mortarboard
              href: https://scholar.google.com/citations?user=ZzAOZ1QAAAAJ&hl=en
              aria-label: Google Scholar

format: 
    html: 
        theme:
            light: cosmo
            dark: darkly
        toc: true
        anchor-sections: true
        css:
          - https://cdn.jsdelivr.net/npm/academicons@1.9.4/css/academicons.min.css
          - styles.css
